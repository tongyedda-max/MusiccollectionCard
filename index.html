<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎵 音樂記錄生成器 → Logseq</title>
<style>
body{font-family:system-ui;max-width:680px;margin:0 auto;padding:12px;background:#fafafa;color:#222}
h1{font-size:20px}h2{margin:14px 0 4px;font-size:16px}h3{margin:12px 0 4px;font-size:14px}
label{font-size:13px;color:#555;display:block;margin:8px 0 2px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:6px 10px;border-radius:999px;background:#e8e8ff;border:none;font-size:14px}
.chip.on{background:#5b5bd6;color:#fff}
button{font-size:15px;padding:9px 12px;border-radius:8px;border:1px solid #ccc;background:#fff}
.go{background:#5b5bd6;color:#fff;border:none;width:100%;font-size:17px;padding:13px;margin-top:12px}
.clr{font-size:13px;color:#a33;margin-top:8px;width:100%}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #ccc;border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0}.seg .on{background:#5b5bd6;color:#fff}
.note{font-size:12px;color:#888}.row{display:flex;gap:6px;margin:4px 0;align-items:flex-start}
.row input,.row textarea{flex:1}.row .tm{max-width:85px;flex:none}
.saved{color:#2a7;font-size:13px}
.tabs{display:flex;gap:5px;margin:10px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:80px}.tabs .on{background:#5b5bd6;color:#fff;border-color:#5b5bd6}
.page{display:none}.page.show{display:block}
.traylab{font-size:12px;color:#888;margin:6px 0 2px}
.vrow{border-bottom:1px solid #eee;padding:8px 2px;font-size:14px}
.vrow b{font-size:15px}.vrow .en{color:#5b5bd6}
.vrow .vn{display:block;color:#777;font-size:13px;margin-top:2px}
.vrow .del{float:right;border:none;color:#a33;font-size:13px}
.catbar{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.catbar button{font-size:13px;padding:6px 9px}.catbar .on{background:#333;color:#fff}
#playerWrap{margin:8px 0}#ytbox{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.ytmeta{display:flex;gap:8px;align-items:center;margin:8px 0}
.ytmeta img{width:80px;border-radius:6px}
</style>
</head>
<body>
<h1>🎵 音樂記錄生成器 <span class="saved" id="tag"></span></h1>
<p class="note">原版五步全欄位 → 生成 → Copy → 貼入 Logseq。自動存。</p>

<div class="tabs">
<button id="tab-ver" class="on" onclick="show('ver')">💿 版本</button>
<button id="tab-work" onclick="show('work')">🎼 作品</button>
<button id="tab-mus" onclick="show('mus')">🎻 音樂人</button>
<button id="tab-voc" onclick="show('voc')">📚 詞庫</button>
</div>

<!-- ═══ 💿 版本 ═══ -->
<div class="page show" id="page-ver">
<h2>① 來源</h2>
<label>YouTube 連結</label><input id="url" placeholder="https://youtu.be/...">
<button onclick="fetchMeta()">抓取標題／縮圖</button>
<div id="ytmeta" class="ytmeta hidden"><img id="ytThumb" alt=""><div><b id="ytTitle"></b><p class="note" id="ytChan"></p><button onclick="useTitle()">用標題做版本名</button></div></div>
<label>平台（自動偵測）</label><input id="platform">
<label>時長 mm:ss</label><input id="dur">
<h2>② 錄音資料</h2>
<label>演奏者（打名＋Enter，會連去音樂人卡）</label><input id="perfInput">
<div class="chips" id="perfChips"></div>
<label>演出日期</label><input id="date" type="date">
<label>樂團／場地</label><input id="venue">
<label>Label</label><input id="label" placeholder="DG / Sony…">
<label>片源</label><div class="seg" id="srcSeg"></div>
<label>性質</label><div class="seg" id="natSeg"></div>
<h2>③ 作品確認</h2>
<label>版本名</label><input id="verName">
<label>作品名（要同作品卡一致）</label><input id="workName">
<label>作曲家</label><select id="composerSel"></select>
<label>作曲家自訂（填咗取代上面）</label><input id="composerCus">
<label>演出範圍</label><div class="seg" id="rangeSeg"></div>
<label>樂章</label><input id="movs" placeholder="1. 2. 3. 4.">
<label>對比版本（可空）</label><input id="vcomp">
<h2>④ 逐段筆記</h2>
<button onclick="loadYT()">▶️ 載入播放器（落釘用）</button>
<div id="playerWrap" class="hidden"><div id="ytbox"></div>
<button onclick="pin()" style="width:100%;margin-top:6px">⏱ 落釘（記低而家時間）</button></div>
<p class="note">先撳入某行再落釘＝釘嗰行；冇揀就自動加新行。Bilibili 等唔支援內嵌，手打時間都得。</p>
<div id="notes"></div>
<button onclick="addNote()">＋ 加一段</button>
<div class="traylab">術語快選（撳入某行後用）</div><div class="chips" id="trayNote"></div>
<h2>⑤ 總結</h2>
<label>狀態</label><div class="seg" id="stSeg"></div>
<label>總評</label><div class="seg" id="rtSeg"></div>
<label>速度印象</label><input id="f_tempo">
<div class="chips" id="trayTempo"></div>
<label>音色取向</label><input id="f_timbre">
<label>風格取向</label><input id="f_style">
<label>一句話總評</label><input id="verdict">
<h3>✅ 最鍾意</h3><div id="likeRows"></div><button onclick="addRow('likeRows',likes,'邊段／邊樣？')">＋ 加</button>
<h3>⛔ 唔鍾意</h3><div id="dislikeRows"></div><button onclick="addRow('dislikeRows',dislikes,'邊段／邊樣？')">＋ 加</button>
<h3>✍️ 對我自己拉奏嘅改動（≤5行）</h3><div id="changeRows"></div><button onclick="addRow('changeRows',changes,'改乜？')">＋ 加一行</button>
<h3>🧪 練習實驗</h3><div id="expRows"></div><button onclick="addRow('expRows',exps,'試乜？')">＋ 加</button>
<label>待補</label><input id="todo">
<button class="go" onclick="genVer()">⚙️ 生成版本卡</button>
<label>輸出</label><textarea id="outVer" rows="12"></textarea>
<button style="width:100%" onclick="copyOut('outVer')">📋 Copy</button>
<button class="clr" onclick="clearCard('ver',this)">🧹 清空呢張卡</button>
</div>

<!-- ═══ 🎼 作品 ═══ -->
<div class="page" id="page-work">
<label>作品名稱</label><input id="w_name">
<label>暱稱</label><input id="w_nick" placeholder="命運">
<label>作曲家</label><select id="w_comp"></select>
<label>作曲家自訂</label><input id="w_compCus">
<label>作品編號</label><input id="w_cat" placeholder="Op.67 / K.550 / BWV 1007">
<label>總調性</label><input id="w_key" placeholder="C小調">
<label>編制</label><input id="w_scoring" placeholder="獨奏小提琴＋樂團">
<label>樂譜版本</label><input id="w_edition" placeholder="Henle URTEXT">
<label>時期／樂派（撳揀）</label><div class="chips" id="eraChips"></div>
<label>創作年份</label><input id="w_year" inputmode="numeric">
<h3>曲式結構（逐樂章）</h3>
<div id="movRows"></div>
<button onclick="addMov()">＋ 加樂章</button>
<div class="traylab">速度/表情快選（撳入某行後用）</div><div class="chips" id="trayMov"></div>
<label>創作背景（可跳）</label><textarea id="w_background" rows="3"></textarea>
<label>題獻／首演</label><input id="w_dedication">
<label>同類作品（連去另一作品卡）</label><input id="w_similar" placeholder="第六交響曲">
<textarea id="w_similarnote" rows="2" placeholder="一句講同邊首似、似喺邊"></textarea>
<h3>🎯 理想版本目標（各一句）</h3>
<input id="goal_narrative" placeholder="敘事：…">
<input id="goal_tempo" placeholder="速度：…">
<input id="goal_timbre" placeholder="音色：…">
<input id="goal_style" placeholder="風格：…">
<input id="goal_structure" placeholder="結構焦點：…">
<h3>📎 資料來源</h3>
<div id="wsrcRows"></div>
<button onclick="addSrc('wsrcRows',wsrc)">📎 加來源</button>
<button class="go" onclick="genWork()">⚙️ 生成作品卡</button>
<label>輸出</label><textarea id="outWork" rows="12"></textarea>
<button style="width:100%" onclick="copyOut('outWork')">📋 Copy</button>
<button class="clr" onclick="clearCard('work',this)">🧹 清空呢張卡</button>
</div>

<!-- ═══ 🎻 音樂人 ═══ -->
<div class="page" id="page-mus">
<label>名稱</label><input id="m_name">
<label>別名／其他拼寫</label><input id="m_alias" placeholder="Hahn, Hilary">
<label>類型（撳揀）</label><div class="chips" id="mtypeChips"></div>
<label>樂器（撳詞庫或打名＋Enter）</label><input id="m_instIn">
<div class="chips" id="m_chips"></div>
<label>Roles（撳詞庫或打名＋Enter）</label><input id="m_roleIn">
<div class="chips" id="r_chips"></div>
<label>Style-Era</label><input id="m_styleera" placeholder="現代，美國派">
<label>活躍年代</label>
<div class="row"><input id="m_from" inputmode="numeric" placeholder="由，例 1990"><input id="m_to" inputmode="numeric" placeholder="迄（在世留空）"></div>
<label>一句話</label><textarea id="m_oneline" rows="2"></textarea>
<p class="note">常合作音樂人＋錄音清單：Logseq 自動計，唔使填。</p>
<h3>📎 資料來源</h3>
<div id="msrcRows"></div>
<button onclick="addSrc('msrcRows',msrc)">📎 加來源</button>
<button class="go" onclick="genMus()">⚙️ 生成音樂人卡</button>
<label>輸出</label><textarea id="outMus" rows="10"></textarea>
<button style="width:100%" onclick="copyOut('outMus')">📋 Copy</button>
<button class="clr" onclick="clearCard('mus',this)">🧹 清空呢張卡</button>
</div>

<!-- ═══ 📚 詞庫 ═══ -->
<div class="page" id="page-voc">
<label>搜尋（中/英/解釋）</label><input id="vq" oninput="renderVocabList()">
<div class="catbar" id="catbar"></div>
<div id="vlist"></div>
<h2>＋ 新增詞條（存呢部機）</h2>
<label>中文（必要）</label><input id="va_zh">
<label>英文</label><input id="va_en">
<label>類別</label><select id="va_cat"></select>
<label>解釋</label><input id="va_note">
<button class="go" onclick="addVocab()">＋ 加入詞庫</button>
</div>

function drawList(box,arr){$(box).innerHTML="";arr.forEach((p,i)=>{const b=document.createElement("button");b.className="chip on";b.textContent=p+" ×";b.onclick=()=>{arr.splice(i,1);drawList(box,arr);save()};$(box).appendChild(b)})}
function hookAdd(inp,arr,box){$(inp).addEventListener("keydown",e=>{if(e.key===","||e.key==="Enter"){const n=$(inp).value.replace(/,$/,"").trim();if(n&&!arr.includes(n)){arr.push(n);drawList(box,arr);save()}$(inp).value="";e.preventDefault()}})}

(async function(){
function normSeed(e){try{
if(typeof e==="string"){const zh=/[\u4e00-\u9fff]/.test(e);return{cat:"",zh:zh?e:"",en:zh?"":e,note:""}}
if(Array.isArray(e)){const s=e.map(x=>typeof x==="string"?x.trim():"").filter(Boolean);
let cat="",zh="",en="",note="";
if(s.length&&!/[\u4e00-\u9fff]/.test(s[0])&&/^[A-Za-z][\w -]{0,12}$/.test(s[0]))cat=s.shift();
s.forEach(x=>{if(/[\u4e00-\u9fff]/.test(x)){if(!zh)zh=x;else if(!note)note=x}
else if(/^[A-Za-z]/.test(x)){if(!en)en=x;else if(!note)note=x}
else if(!note)note=x});
return{cat:cat,zh:zh,en:en,note:note}}
if(e&&typeof e==="object"){const g=ks=>{for(const k of ks){const v=e[k];if(v!=null&&String(v).trim()!=="")return String(v).trim()}return ""};
return{cat:g(["cat","category","type","group","cls","field","tag","tags"]),
zh:g(["zh","zh_hk","zhHK","zh_tw","zhTW","term_zh","termZh","chinese","zh_name","name_zh","c","term","name","word"]),
en:g(["en","english","en_name","english_name","eng","e","term_en","name_en","latin"]),
note:g(["note","desc","description","explain","explanation","meaning","definition","def","memo","tip","summary"])}}}catch(err){}return null}
const FILES=["vocab-seed-1.js","vocab-seed-2.js","vocab.js"];
const names=[];
for(const f of FILES){
await new Promise(res=>{const s=document.createElement("script");s.src=f;s.onload=()=>res();s.onerror=()=>res();document.body.appendChild(s)});
try{const t=await (await fetch(f)).text();const re=/(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*\[/g;let m;
while((m=re.exec(t)))if(names.indexOf(m[1])<0)names.push(m[1])}catch(e){}
}
["VOCAB","VOCAB_SEED","VOCAB_SEEDS","VOCAB_LIST","TERMS","VOCAB_ALL"].forEach(n=>{if(names.indexOf(n)<0)names.push(n)});
const got=[];
names.forEach(n=>{let v=null;try{v=new Function("try{return typeof "+n+"!=='undefined'?"+n+":null}catch(e){return null}")()}catch(e){}
if(Array.isArray(v)&&v.length>=20)got.push({name:n,arr:v})});
Object.keys(window).forEach(k=>{try{const v=window[k];
if(Array.isArray(v)&&v.length>=20&&!got.some(g=>g.arr===v)){const s=normSeed(v[0]);if(s&&(s.zh||s.en))got.push({name:k,arr:v})}}catch(e){}});
if(!got.length){toast("⚠️ 搵唔到詞庫——抄 vocab-seed-1.js 第一行俾我");return}
const CATMAP={composer:"comp",composers:"comp","作曲家":"comp",instrument:"inst",instruments:"inst","樂器":"inst",role:"role",roles:"role","角色":"role",form:"form",forms:"form",genre:"form","曲式":"form","類型":"form",tempo:"tempo","速度":"tempo",dynamic:"dyn",dynamics:"dyn","力度":"dyn",expression:"expr",expressions:"expr",articulation:"expr","表情":"expr",technique:"tech",techniques:"tech",practice:"tech",listening:"tech","學習技術":"tech","聆聽技術":"tech"};
function catKey(c){c=(c||"").toString().trim().toLowerCase();const k=CATMAP[c]||c||"other";if(!CATNAMES[k])CATNAMES[k]=k;return k}
const seen={},list=[];
got.forEach(g=>{let n=0;g.arr.forEach(e=>{const t=normSeed(e);if(!t||(!t.zh&&!t.en))return;const key=t.zh+"|"+t.en;if(seen[key])return;seen[key]=1;list.push([catKey(t.cat),t.zh,t.en,t.note||""]);n++});
if(n)toast("駁通 "+g.name+"："+n+" 條")});
if(list.length>=50){window.__setSeeds(list);setTimeout(()=>toast("詞庫駁通 ✓ 共 "+list.length+" 條"),800)}
else toast("⚠️ 搵到但太少("+list.length+")——screenshot vocab.js 開頭俾我");
})();
  
renderAll();load();
</script>
